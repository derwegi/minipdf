name: Windows-Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Bauen und Installer erzeugen
        run: bash windows/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: minipdf-windows
          path: |
            minipdf-*-setup.exe
            minipdf-portable.zip
